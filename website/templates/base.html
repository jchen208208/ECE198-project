<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CCCARE Staff{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('site.static', filename='style.css') }}">
</head>
<body>
  {% set section = "simulator" if request.endpoint == "site.simulator" else "patients" %}
  <header class="topbar">
    <div class="topbar-inner">
      <a href="{{ url_for('site.patient_list') }}" class="brand"><strong>CCCARE</strong> <span>Staff</span></a>
      <nav>
        <a href="{{ url_for('site.patient_list') }}" {% if section == "patients" %}aria-current="page"{% endif %}>Patients</a>
        <a href="{{ url_for('site.simulator') }}" {% if section == "simulator" %}aria-current="page"{% endif %}>Station simulator</a>
      </nav>
    </div>
  </header>

  <main>
    {% for message in get_flashed_messages() %}
      <p class="flash" role="status">{{ message }}</p>
    {% endfor %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
